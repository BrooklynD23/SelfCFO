<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bill Split</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b7cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                        "paper": "#ffffff", // Clean white for receipt
                        "paper-texture": "#fbfbfb", // Subtle offset for texture feel
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"],
                        "mono": ["Public Sans", "monospace"] // Using Public Sans for numbers/tabular data
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                    boxShadow: {
                        "receipt": "0 2px 10px rgba(0, 0, 0, 0.05)",
                        "float": "0 -4px 20px rgba(0, 0, 0, 0.08)"
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Receipt jagged edge effect - purely CSS */
        .receipt-bottom {
            background-image: linear-gradient(135deg, transparent 50%, #f6f7f8 50%), linear-gradient(45deg, transparent 50%, #f6f7f8 50%);
            background-position: top;
            background-repeat: repeat-x;
            background-size: 20px 20px;
            height: 20px;
            width: 100%;
            margin-top: -10px;
            position: relative;
            z-index: 10;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark text-[#111418] font-display antialiased overflow-hidden">
<div class="relative flex h-full max-h-screen w-full flex-col overflow-hidden max-w-md mx-auto bg-background-light shadow-2xl">
<!-- Header -->
<div class="flex items-center bg-background-light p-4 pb-2 justify-between z-20">
<button class="text-[#111418] hover:bg-black/5 rounded-full p-2 flex shrink-0 items-center justify-center transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-[#111418] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Bill Split</h2>
<button class="text-primary font-medium text-sm hidden">Edit</button>
</div>
<!-- Main Scrollable Content -->
<div class="flex-1 overflow-y-auto no-scrollbar pb-40 px-4 pt-2">
<!-- Summary Card -->
<div class="mb-6">
<div class="flex items-stretch justify-between gap-4 rounded-xl bg-white p-5 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100">
<div class="flex flex-col justify-center gap-1 flex-[2_2_0px]">
<p class="text-[#617289] text-xs font-medium uppercase tracking-wider">Total Bill</p>
<p class="text-[#111418] text-3xl font-bold leading-tight tracking-tight">$84.50</p>
<div class="flex gap-3 mt-2">
<span class="bg-gray-100 px-2 py-1 rounded text-xs font-medium text-gray-600">Tax: $6.50</span>
<span class="bg-blue-50 px-2 py-1 rounded text-xs font-medium text-primary">Tip: $12.00</span>
</div>
</div>
<div class="w-20 bg-center bg-no-repeat bg-cover rounded-lg flex-none shadow-inner" data-alt="Stylized icon of a restaurant receipt or dining table" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA-u-EBmXZldsR1rTAMkidVv3dqhEU1rUpD2XDO4WAumISEDNjwUwY2KXc9CD38MvgSVdAsdMouNSrJPLRqRiwQJ7FORZWjtxyukoZzdSb1aQbZ04B3a-J6j6-YRX4M3CJxjgub05trMPuMjvv5YQ3FFVhXg6G8kFCl3tnSZOfsQg7-Gee2Bk-_7pIkdLCyUCblAf3JkfZjSM2XsVTZxoqL1X9yXTadAi6O-6NK8rNA6Be_pMhxPYmEwuOxNPucXOZq16gkHFQtQlU");'></div>
</div>
</div>
<!-- Receipt Container -->
<div class="relative flex flex-col w-full">
<!-- Receipt Paper -->
<div class="bg-paper shadow-receipt rounded-t-xl overflow-hidden relative pb-6">
<!-- Texture Overlay (subtle) -->
<div class="absolute inset-0 bg-paper-texture opacity-30 pointer-events-none"></div>
<!-- Receipt Header -->
<div class="p-6 border-b border-dashed border-gray-200 relative z-10">
<div class="flex justify-between items-start mb-2">
<div>
<h3 class="font-bold text-lg text-gray-900">La Trattoria</h3>
<p class="text-xs text-gray-500">Aug 24, 2023 • 8:42 PM</p>
</div>
<div class="bg-gray-100 rounded-full p-2">
<span class="material-symbols-outlined text-gray-400 text-xl block">receipt_long</span>
</div>
</div>
</div>
<!-- Receipt Items (OCR Data) -->
<div class="p-4 space-y-1 relative z-10">
<!-- Item 1: Unassigned -->
<button class="w-full group flex items-center justify-between gap-x-3 py-3 px-3 rounded-lg hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-200">
<div class="flex items-center gap-3 overflow-hidden">
<div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center group-hover:border-primary transition-colors">
<span class="block w-2.5 h-2.5 rounded-full bg-transparent group-hover:bg-primary transition-colors"></span>
</div>
<div class="flex flex-col items-start">
<p class="text-[#111418] text-sm font-medium leading-normal truncate">1x Artisanal Pizza</p>
<p class="text-gray-400 text-xs">Unassigned</p>
</div>
</div>
<p class="text-[#111418] text-sm font-bold leading-normal text-right font-display">$22.00</p>
</button>
<!-- Item 2: Assigned to JD -->
<button class="w-full group flex items-center justify-between gap-x-3 py-3 px-3 rounded-lg bg-blue-50/50 border border-blue-100">
<div class="flex items-center gap-3 overflow-hidden">
<div class="w-6 h-6 rounded-full border-2 border-primary bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[14px]">check</span>
</div>
<div class="flex flex-col items-start">
<p class="text-[#111418] text-sm font-medium leading-normal truncate">2x Craft Soda</p>
<p class="text-primary text-xs">Assigned to JD</p>
</div>
</div>
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center text-[10px] font-bold border border-purple-200">JD</div>
<p class="text-[#111418] text-sm font-bold leading-normal text-right font-display">$10.00</p>
</div>
</button>
<!-- Item 3: Split 3 ways -->
<button class="w-full group flex items-center justify-between gap-x-3 py-3 px-3 rounded-lg bg-blue-50/50 border border-blue-100">
<div class="flex items-center gap-3 overflow-hidden">
<div class="w-6 h-6 rounded-full border-2 border-primary bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[14px]">check</span>
</div>
<div class="flex flex-col items-start">
<p class="text-[#111418] text-sm font-medium leading-normal truncate">1x Truffle Fries</p>
<p class="text-primary text-xs">Split 3 ways</p>
</div>
</div>
<div class="flex items-center gap-2">
<div class="flex -space-x-2">
<div class="w-6 h-6 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center text-[10px] font-bold border border-white ring-1 ring-white z-20">JD</div>
<div class="w-6 h-6 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-[10px] font-bold border border-white ring-1 ring-white z-10">AM</div>
<div class="w-6 h-6 rounded-full bg-orange-100 text-orange-700 flex items-center justify-center text-[10px] font-bold border border-white ring-1 ring-white z-0">RK</div>
</div>
<p class="text-[#111418] text-sm font-bold leading-normal text-right font-display">$9.50</p>
</div>
</button>
<!-- Item 4: Unassigned -->
<button class="w-full group flex items-center justify-between gap-x-3 py-3 px-3 rounded-lg hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-200">
<div class="flex items-center gap-3 overflow-hidden">
<div class="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center group-hover:border-primary transition-colors">
<span class="block w-2.5 h-2.5 rounded-full bg-transparent group-hover:bg-primary transition-colors"></span>
</div>
<div class="flex flex-col items-start">
<p class="text-[#111418] text-sm font-medium leading-normal truncate">1x Tiramisu</p>
<p class="text-gray-400 text-xs">Unassigned</p>
</div>
</div>
<p class="text-[#111418] text-sm font-bold leading-normal text-right font-display">$8.00</p>
</button>
</div>
<!-- Receipt Footer -->
<div class="p-4 pt-2 border-t border-dashed border-gray-200 mt-2 relative z-10">
<div class="flex justify-between items-center text-gray-500 text-xs uppercase tracking-widest">
<span>Subtotal</span>
<span>$49.50</span>
</div>
</div>
</div>
<!-- Jagged Bottom Edge -->
<div class="receipt-bottom"></div>
</div>
</div>
<!-- Sticky Action Dock & Navigation -->
<div class="absolute bottom-0 left-0 w-full bg-white z-30 shadow-float rounded-t-2xl border-t border-gray-100">

<div class="p-4 pb-2">
<div class="flex items-center justify-between mb-3 px-1">
<h3 class="text-[#111418] text-sm font-bold">Assign to:</h3>
<button class="text-primary text-xs font-semibold flex items-center gap-1">
<span class="material-symbols-outlined text-sm">group_add</span> Add Friend
                    </button>
</div>
<div class="flex gap-4 overflow-x-auto no-scrollbar pb-2 items-center">
<!-- Me (Selected) -->
<div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold border-4 border-blue-100 ring-2 ring-primary relative shadow-sm">
                            ME
                            <div class="absolute -top-1 -right-1 bg-white rounded-full p-0.5 shadow-sm">
<span class="material-symbols-outlined text-primary text-[14px]">check_circle</span>
</div>
</div>
<span class="text-[10px] font-medium text-primary">You</span>
</div>
<!-- Friend 1 -->
<div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer opacity-60 hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center text-sm font-bold border-4 border-transparent hover:border-purple-50">
                            JD
                        </div>
<span class="text-[10px] font-medium text-gray-500">John</span>
</div>
<!-- Friend 2 -->
<div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer opacity-60 hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-sm font-bold border-4 border-transparent hover:border-teal-50">
                            AM
                        </div>
<span class="text-[10px] font-medium text-gray-500">Alex</span>
</div>
<!-- Friend 3 -->
<div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer opacity-60 hover:opacity-100 transition-opacity">
<div class="w-12 h-12 rounded-full bg-orange-100 text-orange-700 flex items-center justify-center text-sm font-bold border-4 border-transparent hover:border-orange-50">
                            RK
                        </div>
<span class="text-[10px] font-medium text-gray-500">Ravi</span>
</div>
</div>
<div class="flex gap-3 mt-2">
<button class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 px-4 rounded-xl text-sm flex items-center justify-center gap-2 hover:bg-gray-200 transition-colors">
                        Split Remaining
                    </button>
<button class="flex-[2] bg-primary text-white font-bold py-3 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30 hover:bg-blue-600 transition-colors">
                        Done
                    </button>
</div>
</div>
<!-- Bottom Navigation Tab Bar -->
<div class="flex justify-around items-center pt-2 pb-6 border-t border-gray-100 bg-white">
<button class="flex flex-col items-center gap-1 w-full text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">home</span>
<span class="text-[10px] font-medium">Home</span>
</button>
<button class="flex flex-col items-center gap-1 w-full text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">receipt_long</span>
<span class="text-[10px] font-medium">History</span>
</button>
<button class="flex flex-col items-center gap-1 w-full text-primary">
<div class="bg-blue-50 px-5 py-1 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-2xl fill-1">document_scanner</span>
</div>
<span class="text-[10px] font-medium font-bold">Scan</span>
</button>
<button class="flex flex-col items-center gap-1 w-full text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">group</span>
<span class="text-[10px] font-medium">Friends</span>
</button>
<button class="flex flex-col items-center gap-1 w-full text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="text-[10px] font-medium">Profile</span>
</button>
</div>
</div>
</div>
