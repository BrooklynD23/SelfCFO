# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run checks
        run: ./gradlew check

      - name: Build shared module
        run: ./gradlew :shared:build

      # Desktop builds on all platforms for main branch, but only macOS/Windows for PRs
      # Rationale: Linux desktop builds are faster but less commonly deployed; 
      # main branch needs full coverage, PRs can skip Linux desktop for faster feedback
      - name: Build desktop app
        if: matrix.os != 'ubuntu-latest' || github.ref == 'refs/heads/main'
        run: ./gradlew :desktop:build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/build/reports/tests/'
          retention-days: 7

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      # Using explicit dev flavor for deterministic debug builds
      - name: Build Android debug APK (dev flavor)
        run: ./gradlew :android:assembleDevDebug

      - name: Run Android unit tests (dev flavor)
        run: ./gradlew :android:testDevDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-debug-apk
          path: android/build/outputs/apk/dev/debug/*.apk
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: '**/build/reports/detekt/'
          retention-days: 7
